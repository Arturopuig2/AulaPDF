{% extends "base.html" %}

{% block content %}
<style>
    .forgot-card {
        background: white;
        padding: 3rem 2rem;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        max-width: 400px;
        margin: 4rem auto;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .forgot-title {
        color: #1e293b;
        font-weight: 800;
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        letter-spacing: -0.5px;
    }

    .forgot-description {
        color: #64748b;
        font-size: 0.95rem;
        margin-bottom: 2rem;
        line-height: 1.5;
    }

    .form-group {
        text-align: left;
        margin-bottom: 1.5rem;
    }

    .form-label {
        font-weight: 600;
        color: #64748b;
        margin-bottom: 0.5rem;
        display: block;
        font-size: 0.95rem;
    }

    .form-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.2s;
        box-sizing: border-box;
        outline: none;
    }

    .form-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-gradient {
        background: linear-gradient(135deg, #3b82f6 0%, #d946ef 100%);
        color: white;
        border: none;
        padding: 0.9rem;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
        transition: opacity 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn-gradient:hover {
        opacity: 0.95;
        transform: translateY(-1px);
    }

    .btn-gradient:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .bottom-links {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #64748b;
    }

    .bottom-links a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
        display: inline-block;
    }

    .bottom-links a:hover {
        text-decoration: underline;
    }

    .status-msg {
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        text-align: left;
        display: none;
    }
</style>

<div class="forgot-card">
    <h1 class="forgot-title">Recuperar Contraseña</h1>
    <p class="forgot-description">
        Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <div id="status-message" class="status-msg"></div>

    <form id="forgot-form" onsubmit="handleForgotPassword(event)">
        <div class="form-group">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" id="email" class="form-input" required autofocus placeholder="tu@correo.com">
        </div>

        <button type="submit" id="submit-btn" class="btn-gradient">Enviar Enlace</button>
    </form>

    <div class="bottom-links">
        <a href="/login">Volver a Iniciar Sesión</a>
    </div>
</div>

<script>
    async function handleForgotPassword(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const statusDiv = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');

        submitBtn.disabled = true;
        submitBtn.innerText = "Enviando...";
        statusDiv.style.display = 'none';

        const formData = new FormData();
        formData.append('email', email);

        try {
            const response = await fetch('/forgot-password', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            statusDiv.style.display = 'block';
            if (response.ok) {
                statusDiv.style.backgroundColor = '#dcfce7';
                statusDiv.style.color = '#15803d';
                statusDiv.style.border = '1px solid #bbf7d0';
                statusDiv.innerText = result.message || 'Enlace de recuperación enviado.';
                document.getElementById('forgot-form').reset();
            } else {
                statusDiv.style.backgroundColor = '#fef2f2';
                statusDiv.style.color = '#b91c1c';
                statusDiv.style.border = '1px solid #fecaca';
                statusDiv.innerText = result.detail || 'Ha ocurrido un error al procesar tu solicitud.';
            }
        } catch (error) {
            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#fef2f2';
            statusDiv.style.color = '#b91c1c';
            statusDiv.style.border = '1px solid #fecaca';
            statusDiv.innerText = 'Error de conexión. Inténtalo de nuevo.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Enviar Enlace";
        }
    }
</script>
{% endblock %}
