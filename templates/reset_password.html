{% extends "base.html" %}

{% block content %}
<style>
    .reset-card {
        background: white;
        padding: 3rem 2rem;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        max-width: 400px;
        margin: 4rem auto;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .reset-title {
        color: #1e293b;
        font-weight: 800;
        font-size: 1.8rem;
        margin-bottom: 2rem;
        letter-spacing: -0.5px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 1.5rem;
    }

    .form-label {
        font-weight: 600;
        color: #64748b;
        margin-bottom: 0.5rem;
        display: block;
        font-size: 0.95rem;
    }

    .form-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.2s;
        box-sizing: border-box;
        outline: none;
    }

    .form-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-gradient {
        background: linear-gradient(135deg, #3b82f6 0%, #d946ef 100%);
        color: white;
        border: none;
        padding: 0.9rem;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
        transition: opacity 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn-gradient:hover {
        opacity: 0.95;
        transform: translateY(-1px);
    }

    .btn-gradient:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .bottom-links {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #64748b;
    }

    .bottom-links a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
        display: inline-block;
    }

    .bottom-links a:hover {
        text-decoration: underline;
    }

    .status-msg {
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        text-align: left;
        display: none;
    }

    .password-wrapper {
        position: relative;
    }

    .toggle-eye {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 1.2rem;
        user-select: none;
    }
</style>

<div class="reset-card">
    <h1 class="reset-title">Nueva Contraseña</h1>

    <div id="status-message" class="status-msg"></div>

    <form id="reset-form" onsubmit="handleResetPassword(event)">
        <div class="form-group">
            <label class="form-label">Nueva Contraseña</label>
            <div class="password-wrapper">
                <input type="text" id="new_password" class="form-input" required autofocus placeholder="Nueva contraseña">
                <span id="toggle-new-password" class="toggle-eye">🐵</span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Confirmar Nueva Contraseña</label>
            <div class="password-wrapper">
                <input type="text" id="confirm_password" class="form-input" required placeholder="Repite la nueva contraseña">
                <span id="toggle-confirm-password" class="toggle-eye">🐵</span>
            </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-gradient">Restablecer Contraseña</button>
    </form>

    <div class="bottom-links">
        <a href="/login">Ir a Iniciar Sesión</a>
    </div>
</div>

<script>
    // Extract token from URL query params
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const statusDiv = document.getElementById('status-message');
    const resetForm = document.getElementById('reset-form');

    if (!token) {
        statusDiv.style.display = 'block';
        statusDiv.style.backgroundColor = '#fef2f2';
        statusDiv.style.color = '#b91c1c';
        statusDiv.style.border = '1px solid #fecaca';
        statusDiv.innerText = 'Error: El enlace de recuperación es inválido o no contiene un token válido.';
        resetForm.style.display = 'none';
    }

    // Toggle function for password visibility
    function setupPasswordToggle(inputId, toggleId) {
        const input = document.getElementById(inputId);
        const toggle = document.getElementById(toggleId);
        if (input && toggle) {
            toggle.addEventListener('click', function() {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                toggle.textContent = type === 'password' ? '🙈' : '🐵';
            });
        }
    }

    setupPasswordToggle('new_password', 'toggle-new-password');
    setupPasswordToggle('confirm_password', 'toggle-confirm-password');

    async function handleResetPassword(event) {
        event.preventDefault();
        const newPassword = document.getElementById('new_password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const submitBtn = document.getElementById('submit-btn');

        if (newPassword !== confirmPassword) {
            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#fef2f2';
            statusDiv.style.color = '#b91c1c';
            statusDiv.style.border = '1px solid #fecaca';
            statusDiv.innerText = 'Las contraseñas no coinciden.';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Restableciendo...";
        statusDiv.style.display = 'none';

        const formData = new FormData();
        formData.append('token', token);
        formData.append('new_password', newPassword);
        formData.append('confirm_password', confirmPassword);

        try {
            const response = await fetch('/reset-password', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            statusDiv.style.display = 'block';

            if (response.ok) {
                statusDiv.style.backgroundColor = '#dcfce7';
                statusDiv.style.color = '#15803d';
                statusDiv.style.border = '1px solid #bbf7d0';
                statusDiv.innerHTML = '¡Contraseña restablecida con éxito! Ahora puedes <a href="/login" style="font-weight: bold; color: #15803d; text-decoration: underline;">Iniciar Sesión</a>.';
                resetForm.reset();
                resetForm.style.display = 'none';
            } else {
                statusDiv.style.backgroundColor = '#fef2f2';
                statusDiv.style.color = '#b91c1c';
                statusDiv.style.border = '1px solid #fecaca';
                statusDiv.innerText = result.detail || 'Ha ocurrido un error al restablecer la contraseña.';
            }
        } catch (error) {
            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#fef2f2';
            statusDiv.style.color = '#b91c1c';
            statusDiv.style.border = '1px solid #fecaca';
            statusDiv.innerText = 'Error de conexión. Inténtalo de nuevo.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Restablecer Contraseña";
        }
    }
</script>
{% endblock %}
